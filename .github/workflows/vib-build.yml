name: Vib Build

on:
  push:
    branches: 
      - 'ci'
    tags: 
      - '*'
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: FangcatChina/builder-gh-action@22b029f552eea2e4f04497b3e2e4723dbbab49c2
        with:
          mode: build
          image: ghcr.io/${{ github.repository_owner }}/gnome

  merge:
    name: Merge manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: FangcatChina/builder-gh-action@22b029f552eea2e4f04497b3e2e4723dbbab49c2
        with:
          mode: merge
          image: ghcr.io/${{ github.repository_owner }}/gnome