name: Vib Build

on:
  push:
    branches:
      - 'dev'
    tags:
      - '*'
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: fangcatchina/build-gh-action@b95f4166debc9736ecba4184efb40374f8ffb625
        with:
          image: ghcr.io/${{ github.repository_owner }}/gnome
          base-image: ghcr.io/vanilla-os/core

  merge:
    name: Merge
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: fangcatchina/merge-gh-action@35d2c26b49515031bd87b3cfbce3589891be5aaa
        with:
          image: ghcr.io/${{ github.repository_owner }}/gnome