name: Vib Build

on:
  push:
    branches:
      - 'dev'
    tags:
      - '*'
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
          - runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: fangcatchina/build-gh-action@1f062839d475d3acb5b304d5027a1b0ebd5fda81
        with:
          image: ghcr.io/${{ github.repository_owner }}/gnome
          base-image: ghcr.io/vanilla-os/core

  merge:
    name: Merge
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: fangcatchina/merge-gh-action@4809840231f5f1d9ccdb07c35466b683a60155eb
        with:
          image: ghcr.io/${{ github.repository_owner }}/gnome
